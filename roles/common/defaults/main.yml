---
common_timezone: Etc/UTC
common_ntp_servers:
  - time.cloudflare.com
  - pool.ntp.org

common_base_packages:
  - ca-certificates
  - curl
  - git
  - htop
  - jq
  - net-tools
  - python3-apt
  - rsync
  - tcpdump
  - unattended-upgrades
  - vim
  - socat

common_admin_users:
  - name: deploy
    comment: Automation and admin account
    groups: [sudo]
    authorized_keys: []

common_manage_etc_hosts: true
common_manage_firewall: true
common_firewall_allowed_tcp: [22]

common_ssh_permit_root_login: "no"
common_ssh_password_auth: false
common_ssh_max_auth_tries: 3

common_unattended_upgrades: true
common_sysctl_tuning: true