---
- name: Restart sshd
  ansible.builtin.systemd_service:
    name: ssh
    state: restarted
  when: not common_is_container

- name: Restart chrony
  ansible.builtin.systemd_service:
    name: chrony
    state: restarted
  when: not common_is_container

- name: Reload sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true







