---
- name: Create app group
  ansible.builtin.group:
    name: "{{ app_group }}"
    system: true

- name: Create app user
  ansible.builtin.user:
    name: "{{ app_user }}"
    group: "{{ app_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ app_root }}"
    create_home: false


- name: Create directory structure
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0755"
  loop:
    - "{{ app_root }}"
    - "{{ app_root }}/releases"
    - "{{ app_root }}/releases/{{ app_version }}"
    - /etc/hawp

- name: Install python venv tooling
  ansible.builtin.pakcage:
    name: [python3-venv, python3-pip]
    state: present

- name: Create virtualenv and install dependencies
  ansible.builtin.pip:
    name: "{{ app_python_packages }}"
    virtualenv: "{{ app_root }}/venv"
    virtualenv_command: python3 -m venv

- name: Deploy application code
  ansible.builtin.copy:
    src: app.py
    dest: "{{ app_root }}/releases/{{ app_version }}/app.py"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0644"
  notify: Restart app


- name: Point current symlink at release
  ansible.builtin.file:
    src: "{{ app_root }}/releases/{{ app_version }}"
    dest: "{{ app_root }}/current"
    state: link
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
  notify: Restart app


- name: Enable and start app
  ansible.builtin.systemd_service:
    name: "{{ app_name }}"
    enabled: true
    state: started
    daemon_reload: true
  when: not common_is_container


- name: Wait for app to accept connections
  ansible.builtin.wait_for:
    host: "{{ app_listen_address }}"
    port: "{{ app_listen_port }}"
    timeout: 30
  when: not common_is_container